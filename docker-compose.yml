################################################################################
# docker-compose.yml – Local development and testing
#
# Services:
#   mongo    – MongoDB (data persisted in named volume)
#   backend  – Express API (depends on mongo)
#   frontend – Vite/nginx (depends on backend)
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # background
#   docker compose down              # stop (data preserved)
#   docker compose down -v           # stop + DELETE volume (fresh DB)
#   docker compose logs -f backend   # stream backend logs
################################################################################

version: "3.9"

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    container_name: taskflow-mongo
    restart: unless-stopped
    # MongoDB is NOT exposed to the host – only accessible inside the Docker network
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db       # persistent data volume
      - mongo-config:/data/configdb
    environment:
      # ⚠️ Set these in .env or GitHub Secrets – never hard-code here
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mern-todo}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taskflow-net

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-youruser}/taskflow-backend:${IMAGE_TAG:-latest}
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Includes auth – stored in .env, never committed
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/${MONGO_DB:-mern-todo}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-taskflow_jwt_secret_change_in_production}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-80}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - taskflow-net

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL is baked into the static build – nginx proxies /api to backend
        VITE_API_URL: ""
    image: ${DOCKERHUB_USERNAME:-youruser}/taskflow-frontend:${IMAGE_TAG:-latest}
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - taskflow-net

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    name: taskflow-mongo-data
  mongo-config:
    name: taskflow-mongo-config

# ── Private Network ────────────────────────────────────────────────────────────
networks:
  taskflow-net:
    name: taskflow-net
    driver: bridge
