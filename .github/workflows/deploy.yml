################################################################################
# .github/workflows/deploy.yml
#
# TaskFlow MERN – CI/CD Pipeline
#
# Trigger:
#   • Push to main  → full pipeline (test → build → push → deploy)
#   • Pull request  → CI only (test + build, no push or deploy)
#
# Required GitHub Repository Secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME   – your Docker Hub username
#   DOCKERHUB_TOKEN      – Docker Hub access token (read/write, NOT your password)
#
# Optional secrets (for self-hosted runner auto-deploy – see DEPLOY section):
#   DEPLOY_HOST          – hostname or IP of the Docker host
#   DEPLOY_USER          – SSH user on the Docker host
#   DEPLOY_SSH_KEY       – private SSH key (the runner uses the matching public key)
#   MONGO_ROOT_USER      – MongoDB username for the deployed container
#   MONGO_ROOT_PASSWORD  – MongoDB password (strong, random)
#   MONGO_DB             – database name (default: mern-todo)
#   FRONTEND_PORT        – host port for the frontend  (default: 80)
#   BACKEND_PORT         – host port for the backend   (default: 5000)
################################################################################

name: CI/CD – Build, Test, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image names on Docker Hub
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend
  # Docker Compose project name
  COMPOSE_PROJECT_NAME: taskflow

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Backend CI (lint-free test suite)
  # ────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: 🧪 Backend – Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Spin up a real MongoDB instance for integration tests
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🧪 Run backend tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://localhost:27017/mern-todo-test
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Frontend CI (dependency install + production build)
  # ────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: 🏗️ Frontend – Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔨 Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ""   # nginx proxy handles /api in Docker

      - name: 📤 Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Build & Push Docker images to Docker Hub
  #          Only runs on push to main (not PRs) and after CI passes
  # ────────────────────────────────────────────────────────────────────────────
  docker-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    # Skip on pull requests – we only push images from the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Metadata: derive semantic tags from git info
      - name: 🏷️ Docker metadata – backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 🏷️ Docker metadata – frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # Set up QEMU for multi-arch builds (amd64 + arm64)
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for BuildKit features
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub using GitHub Secrets
      # ⚠️ NEVER print ${{ secrets.DOCKERHUB_TOKEN }} in any step output
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build backend image and push to Docker Hub
      - name: 🔨 Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Build frontend image and push to Docker Hub
      - name: 🔨 Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=

      - name: ✅ Image push summary
        run: |
          echo "Backend : ${{ env.BACKEND_IMAGE }}:latest"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:latest"
          echo "SHA tag : ${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 – Deploy & Container Verification
  #          Pulls the freshly published images and runs an automated live deployment
  #          check directly on the runner.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy & Verify Containers
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Safety timeout
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      # ── Approach A: Self-hosted runner (Docker available on local machine) ──
      #    The runner pulls images and restarts containers directly.

      - name: 🔑 Log in to Docker Hub on runner
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📥 Pull latest images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:latest
          docker pull ${{ env.FRONTEND_IMAGE }}:latest

      - name: 🔁 Restart containers (idempotent)
        env:
          DOCKERHUB_USERNAME:   ${{ secrets.DOCKERHUB_USERNAME }}
          MONGO_ROOT_USER:      ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD:  ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB:             ${{ secrets.MONGO_DB || 'mern-todo' }}
          FRONTEND_PORT:        ${{ secrets.FRONTEND_PORT || '80' }}
          BACKEND_PORT:         ${{ secrets.BACKEND_PORT || '5000' }}
          IMAGE_TAG:            latest
          NODE_ENV:             production
        run: |
          # Stop existing containers (idempotent – safe to run every deploy)
          docker compose -f docker-compose.yml down --remove-orphans || true

          # Start fresh with new images
          docker compose -f docker-compose.yml up -d --no-build

          echo "Waiting for services to become healthy…"
          sleep 20

      # ── Health verification ────────────────────────────────────────────────
      - name: 🏥 Verify backend health
        run: |
          for i in $(seq 1 8); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ secrets.BACKEND_PORT || '5000' }}/api/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Backend health check failed after 40 seconds"
          docker compose -f docker-compose.yml logs backend
          exit 1

      - name: 🏥 Verify frontend health
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ secrets.FRONTEND_PORT || '80' }}/ || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Frontend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Frontend health check failed"
          docker compose -f docker-compose.yml logs frontend
          exit 1

      - name: 📋 Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀  TaskFlow deployed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Frontend : http://localhost:${{ secrets.FRONTEND_PORT || '80' }}"
          echo "Backend  : http://localhost:${{ secrets.BACKEND_PORT || '5000' }}/api/health"
          echo "Commit   : ${{ github.sha }}"
          echo "Branch   : ${{ github.ref_name }}"
          echo "Run by   : ${{ github.actor }}"
          docker ps --filter "name=taskflow" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      # ────────────────────────────────────────────────────────────────────────
      # ── Approach B: SSH Deploy to remote VM (uncomment to use) ──────────────
      # Requires secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
      # ────────────────────────────────────────────────────────────────────────
      # - name: 🔑 Configure SSH
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
      #     chmod 600 ~/.ssh/deploy_key
      #     ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      #
      # - name: 🚀 SSH deploy
      #   run: |
      #     ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
      #       ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
      #       "cd ~/taskflow && \
      #        export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' && \
      #        export MONGO_ROOT_PASSWORD='${{ secrets.MONGO_ROOT_PASSWORD }}' && \
      #        docker compose pull && \
      #        docker compose up -d --no-build && \
      #        docker compose ps"
